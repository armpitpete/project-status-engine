name: Portfolio forensic audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/portfolio-forensic-audit.yml"
      - "scripts/portfolio_forensic_audit.py"
      - "tests/test_portfolio_forensic_audit.py"

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: portfolio-forensic-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out audit implementation
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run deterministic forensic-audit tests
        run: python -m unittest discover -s tests -p "test_portfolio_forensic_audit.py" -v

      - name: Confirm private portfolio token exists
        env:
          FORENSIC_AUDIT_TOKEN: ${{ secrets.PROJECT_STATUS_TOKEN }}
        run: test -n "$FORENSIC_AUDIT_TOKEN"

      - name: Scan Git history, Actions, artifacts and Releases
        env:
          FORENSIC_AUDIT_TOKEN: ${{ secrets.PROJECT_STATUS_TOKEN }}
        run: >-
          python scripts/portfolio_forensic_audit.py
          --owner armpitpete
          --max-repositories 100
          --output private-build/portfolio-forensic-audit.json

      - name: Prove report contains fingerprints rather than values
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("private-build/portfolio-forensic-audit.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["security_boundary"]["secret_values_in_report"] is False
          assert report["security_boundary"]["finding_values_replaced_by_sha256_fingerprint"] is True
          assert report["coverage"]["repositories"] > 0
          print(json.dumps({
              "status": report["status"],
              "repositories": report["coverage"]["repositories"],
              "findings": report["finding_count"],
          }, sort_keys=True))
          PY

      - name: Upload private forensic report
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-forensic-audit
          path: private-build/portfolio-forensic-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish sanitised audit status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_RUN_ID: ${{ github.run_id }}
          AUDIT_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request

          title = "[security] Portfolio forensic audit result"
          report = json.loads(
              Path("private-build/portfolio-forensic-audit.json").read_text(
                  encoding="utf-8"
              )
          )
          coverage = report["coverage"]
          repositories = report.get("repositories") or []
          error_count = sum(len(item.get("errors") or []) for item in repositories)
          limitation_count = sum(
              len(item.get("limitations") or []) for item in repositories
          )

          body = "\n".join(
              [
                  "## Latest private portfolio forensic audit",
                  "",
                  f"- Status: `{report['status']}`",
                  f"- Repositories scanned: `{coverage['repositories']}`",
                  f"- Git refs scanned: `{coverage['refs_scanned']}`",
                  f"- Git objects scanned: `{coverage['git_objects_scanned']}`",
                  f"- Git bytes scanned: `{coverage['git_bytes_scanned']}`",
                  f"- Workflow runs enumerated: `{coverage['workflow_runs_scanned']}`",
                  f"- Workflow logs scanned: `{coverage['workflow_logs_scanned']}`",
                  f"- Actions artifacts scanned: `{coverage['artifacts_scanned']}`",
                  f"- Releases scanned: `{coverage['releases_scanned']}`",
                  f"- Release assets scanned: `{coverage['release_assets_scanned']}`",
                  f"- Findings requiring review: `{report['finding_count']}`",
                  f"- Recorded unavailable/error surfaces: `{error_count}`",
                  f"- Repository-specific scan limitations: `{limitation_count}`",
                  f"- Workflow run ID: `{os.environ['AUDIT_RUN_ID']}`",
                  "- Private artifact: `portfolio-forensic-audit` (30-day retention)",
                  "",
                  "The report contains no matched credential or secret values. "
                  "Each detected value is replaced by a SHA-256 fingerprint and "
                  "is available only in the private workflow artifact.",
                  "",
                  "This issue intentionally contains aggregate coverage only. "
                  "Repository names, finding locations and fingerprints are not copied here.",
              ]
          )

          repository = os.environ["AUDIT_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "project-status-engine-forensic-audit",
          }

          def request(method, url, payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          existing = None
          page = 1
          while existing is None:
              query = urllib.parse.urlencode(
                  {"state": "all", "per_page": "100", "page": str(page)}
              )
              items = request("GET", f"{api_root}/issues?{query}")
              for item in items:
                  if "pull_request" not in item and item.get("title") == title:
                      existing = item
                      break
              if len(items) < 100:
                  break
              page += 1

          if existing is None:
              result = request(
                  "POST",
                  f"{api_root}/issues",
                  {"title": title, "body": body},
              )
              action = "created"
          else:
              result = request(
                  "PATCH",
                  f"{api_root}/issues/{existing['number']}",
                  {"title": title, "body": body, "state": "open"},
              )
              action = "updated"

          print(
              json.dumps(
                  {
                      "action": action,
                      "issue_number": result["number"],
                      "run_id": os.environ["AUDIT_RUN_ID"],
                  },
                  sort_keys=True,
              )
          )
          PY
