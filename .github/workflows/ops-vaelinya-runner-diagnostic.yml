name: Diagnose Vaelinya Oracle runner

on:
  push:
    branches:
      - ops/bootstrap-convergence-proof
    paths:
      - .github/workflows/ops-vaelinya-runner-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH credential
        env:
          DEPLOY_KEY: ${{ secrets.PRIVATE_STATUS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRIVATE_STATUS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Read-only runner diagnostic
        run: |
          set +e
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -i "$RUNNER_TEMP/ssh/id_ed25519" \
            vaelinya@server.vaelinya.uk \
            'set -u; svc="actions.runner.armpitpete-vaelinya-canon.oracle-vaelinya-01.service"; echo "HOST=$(hostname)"; echo "USER=$(id -un)"; echo "--- service state ---"; systemctl is-active "$svc" || true; systemctl --no-pager --full status "$svc" 2>&1 | tail -n 35 || true; echo "--- service cgroup ---"; systemd-cgls --no-pager "/system.slice/$svc" 2>&1 || true; echo "--- full gha-vaelinya process view ---"; ps -eo user:20,pid,ppid,lstart,etime,stat,comm,args --forest | grep -E "gha-vaelinya|Runner.Worker|Runner.Listener|runsvc.sh|/var/lib/gha-vaelinya" | grep -v grep || true; echo "--- github connectivity ---"; curl -fsSI --max-time 15 https://api.github.com/ 2>&1 | head -n 8 || true; echo "--- sudo noninteractive ---"; sudo -n -l 2>&1 || true' \
            > "$RUNNER_TEMP/diag.txt" 2>&1
          rc=$?
          set -e
          printf '\nSSH_EXIT=%s\n' "$rc" >> "$RUNNER_TEMP/diag.txt"
          cat "$RUNNER_TEMP/diag.txt"

      - name: Publish diagnostic report to ops branch
        uses: actions/github-script@v7
        env:
          DIAG_PATH: ${{ runner.temp }}/diag.txt
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = '.ops/vaelinya-runner-diagnostic.txt';
            const branch = context.ref.replace('refs/heads/', '');
            const content = fs.readFileSync(process.env.DIAG_PATH, 'utf8');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: branch });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Record Vaelinya runner diagnostic',
              content: Buffer.from(content).toString('base64'),
              branch,
              ...(sha ? {sha} : {}),
            });
