# recovery probe 3
name: Probe Vaelinya runner maintenance access

on:
  push:
    branches:
      - ops/bootstrap-convergence-proof
    paths:
      - .github/workflows/ops-vaelinya-runner-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH credential
        env:
          DEPLOY_KEY: ${{ secrets.PRIVATE_STATUS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRIVATE_STATUS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Probe maintenance access and codeload
        run: |
          set +e
          {
            echo '--- vaelinya account ---'
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519" vaelinya@server.vaelinya.uk \
              'echo "id=$(id)"; namei -l /var/lib/gha-vaelinya/actions-runner 2>&1 || true; url="https://codeload.github.com/actions/github-script/tar.gz/f28e40c7f34bde8b3046d885e986cb6290c5673b"; printf "codeload="; curl -sS -o /dev/null -w "%{http_code}\n" --max-time 30 "$url"'
            echo "VAELINYA_SSH_EXIT=$?"
            echo '--- root auth-only probe ---'
            ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -i "$RUNNER_TEMP/ssh/id_ed25519" root@server.vaelinya.uk 'echo ROOT_AUTH_OK; id' 2>&1
            echo "ROOT_SSH_EXIT=$?"
          } > "$RUNNER_TEMP/diag.txt" 2>&1
          set -e
          cat "$RUNNER_TEMP/diag.txt"

      - name: Publish diagnostic report to ops branch
        uses: actions/github-script@v7
        env:
          DIAG_PATH: ${{ runner.temp }}/diag.txt
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = '.ops/vaelinya-runner-diagnostic.txt';
            const branch = context.ref.replace('refs/heads/', '');
            const content = fs.readFileSync(process.env.DIAG_PATH, 'utf8');
            let sha;
            try { const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: branch }); sha = current.data.sha; } catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({owner: context.repo.owner, repo: context.repo.repo, path, message: 'Record Vaelinya maintenance-access probe', content: Buffer.from(content).toString('base64'), branch, ...(sha ? {sha} : {})});
